; PlatformIO build configuration
; https://docs.platformio.org/page/projectconf.html
;
; The source lives in ElectronicBrake/ so that the Arduino IDE can open it
; directly as a sketch folder. src_dir points PlatformIO at the same file, so
; both toolchains build one copy of the source and there is nothing to keep in
; sync.
;
;   pio run                  compile
;   pio run --target upload  compile and flash
;   pio device monitor       serial at 115200

[platformio]
src_dir = ElectronicBrake

[env:megaatmega2560]
platform  = atmelavr
board     = megaatmega2560
framework  = arduino

; Must match Serial.begin(115200) in the sketch.
monitor_speed = 115200

; -Wall/-Wextra are worth keeping on: the float comparisons and implicit
; conversions in the RPM maths are exactly where a silent mistake would hide.
build_flags =
    -Wall
    -Wextra
